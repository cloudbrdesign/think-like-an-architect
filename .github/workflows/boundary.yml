name: boundary

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  boundary:
    name: boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Boundary check (education mode) on this repository
        run: python3 tools/boundary_check.py --config .tla/boundary.json
      - name: Planted-violation fixture tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Traceability check on every episode engagement
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r matrix; do
            episode="$(dirname "$(dirname "$matrix")")"
            echo "::group::$episode"
            python3 tools/traceability_check.py "$episode"
            echo "::endgroup::"
            checked=$((checked + 1))
          done < <(find . -path './season-*' -name TRACEABILITY_MATRIX.md -path '*/06-validation/*' | sort)
          echo "episode engagements checked: $checked"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the pull request's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
