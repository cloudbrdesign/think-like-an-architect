name: foundation

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required repository files and no submodules
        run: |
          set -euo pipefail
          for f in README.md LICENSING.md CONTRIBUTING.md .github/CODEOWNERS .github/pull_request_template.md; do
            test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done
          test ! -e .gitmodules || { echo "submodules are not allowed in the education repository"; exit 1; }
          echo "foundation checks passed"
